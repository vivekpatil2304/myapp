name: CI-CD Blue Green Deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: myapp
  CONTAINER_PORT: 5000

jobs:

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    name: Blue Green Deployment
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            
            AWS_REGION="ap-south-1"
            ECR_REGISTRY="075422630228.dkr.ecr.ap-south-1.amazonaws.com"
            ECR_REPOSITORY="myapp"
            IMAGE_TAG="${{ github.sha }}"

            echo "Logging into ECR..."

            aws ecr get-login-password \
              --region $AWS_REGION | \
              docker login \
              --username AWS \
              --password-stdin $ECR_REGISTRY

            echo "Pulling new image..."

            docker pull \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            echo "Starting new container..."

            if docker ps --format '{{.Names}}' | grep -q "^myapp-blue$"; then

              echo "Blue is currently active."
              echo "Starting GREEN..."

              docker rm -f myapp-green || true

              docker run -d \
                --name myapp-green \
                -p 5001:5000 \
                $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

              sleep 10

              curl -f http://localhost:5001/

              sudo sed -i \
                's/127.0.0.1:5000/127.0.0.1:5001/' \
                /etc/nginx/sites-available/myapp

              sudo nginx -t
              sudo systemctl reload nginx

              docker rm -f myapp-blue || true

            else

              echo "Green is currently active."
              echo "Starting BLUE..."

              docker rm -f myapp-blue || true

              docker run -d \
                --name myapp-blue \
                -p 5000:5000 \
                $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

              sleep 10

              curl -f http://localhost:5000/

              sudo sed -i \
                's/127.0.0.1:5001/127.0.0.1:5000/' \
                /etc/nginx/sites-available/myapp

              sudo nginx -t
              sudo systemctl reload nginx

              docker rm -f myapp-green || true

            fi

            echo "Deployment completed."

            docker psname: CI-CD Blue Green Deployment

